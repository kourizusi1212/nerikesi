<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ねりけし工場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#eef3f8;--gl:#d3dfee;--cd:#fff;--tx:#14233d;--sb:#5f7089;--ac:#1d4fd7;--rd:#d93a34;--ln:#c5d3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1726;--gl:#1b2a44;--cd:#172238;--tx:#e7eefb;--sb:#8fa2c1;--ac:#4f7df0;--rd:#e0524b;--ln:#2a3c5c}}
:root[data-theme="dark"]{--bg:#0f1726;--gl:#1b2a44;--cd:#172238;--tx:#e7eefb;--sb:#8fa2c1;--ac:#4f7df0;--rd:#e0524b;--ln:#2a3c5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:500 15px/1.5 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color:var(--tx);background:linear-gradient(var(--gl) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--gl) 1px,transparent 1px) 0 0/24px 24px,var(--bg)}
.w{max-width:680px;margin:auto;padding:12px}
h1{font-size:26px;margin:6px 0 10px;letter-spacing:.06em}
h2{font-size:15px;margin:18px 0 6px;border-left:4px solid var(--rd);padding-left:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:10px;text-align:center}
.c small{display:block;color:var(--sb);font-size:12px}.c b{font-size:18px;display:inline-block}
.sb{color:var(--sb);font-size:12px;margin:2px 0}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:290px;justify-content:flex-end}
#gl{width:100%;height:340px;display:block;background:radial-gradient(ellipse at 50% 28%,var(--cd),var(--bg) 78%);border:1px solid var(--ln);cursor:pointer;touch-action:manipulation;border-radius:6px}
.bar{width:180px;height:8px;border:1px solid var(--ln);border-radius:4px;background:var(--cd);overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--ac);transition:width .15s}
button{font:inherit;color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.row button,.it{background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:10px 12px;cursor:pointer}
.row .main{background:var(--ac);color:#fff;border-color:var(--ac)}
.row .red,.it.red{background:var(--rd);color:#fff;border-color:var(--rd)}
.it{display:block;width:100%;text-align:left;margin-bottom:6px}
.row button,.it{box-shadow:0 3px 0 var(--ln)}button:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.stage{position:relative}.stage::before{content:'';position:absolute;left:11px;right:11px;top:11px;height:340px;pointer-events:none;border-radius:6px;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(8,16,32,.32))}
@keyframes pl{50%{transform:scale(1.07)}}.pl{animation:pl .8s ease-in-out infinite}
.cf{text-align:left}.cf summary{cursor:pointer;font-weight:700}.cf label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--ln)}.cf select,.cf button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:6px;padding:4px 8px}.cf input[type=range]{width:50%}.cf input[type=color]{width:42px;height:28px;padding:0;border:1px solid var(--ln);border-radius:6px;background:none}.cf>button{margin-top:10px}
.pu{position:fixed;pointer-events:none;font-size:16px;color:var(--ac);text-shadow:0 0 3px var(--cd),0 0 3px var(--cd);z-index:9;white-space:nowrap}
@keyframes gl{50%{box-shadow:0 3px 0 var(--ln),0 0 12px var(--ac)}}.it:not(:disabled){animation:gl 2.2s ease-in-out infinite}
#se{max-height:340px;overflow-y:auto;position:relative;padding:6px 6px 0;border:1px solid var(--ln);border-radius:6px;background:var(--cd)}
.it:disabled{opacity:.5;cursor:default}.it.on{border-color:var(--ac);border-width:2px}
textarea{width:100%;height:56px;background:var(--cd);color:var(--tx);border:1px solid var(--ln);border-radius:6px;font-size:12px}
.p{position:fixed;width:6px;height:6px;border-radius:50%;background:#aab6c6;pointer-events:none;z-index:9}
#ts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:13px;text-align:center;max-width:90%}
</style></head><body>
<div class="w">
<h1>🧽 ねりけし工場</h1>
<div class="g3"><div class="c"><small>コイン</small><b id="coin"></b></div><div class="c"><small>消しカス</small><b id="sh"></b></div><div class="c"><small>ねりけし（大きさ/上限）</small><b id="m"></b></div></div>
<div class="c stage">
<canvas id="gl" role="button" tabindex="0" aria-label="消しゴムを削る"></canvas>
<div id="en" class="sb"></div>
<div class="bar"><i id="dub"></i></div>
<p class="sb">消しゴムをタップして削り、カスを集めてねりけしにしよう</p>
<div class="row"><button id="kb" class="main" onclick="knead()">🌀 カスをまとめる</button><button id="sbt" class="red" onclick="sell()">💰 売る（<span id="pr"></span>コイン）</button><button id="rnb" onclick="renew()">🔄 新品に交換（<span id="rcs"></span>）</button></div>
</div>
<h2>消しゴムを買う</h2><div id="se"></div>
<h2>強化</h2><div id="su"></div>
<h2>転生</h2>
<div class="c"><div id="ri"></div>
<p class="sb">今回の累計獲得コインが20万で魂+1、増えるほど獲得量アップ。転生するとコイン・消しゴム・強化がリセットされ、魂による永続ボーナスが得られます。</p>
<button id="rbb" class="it red" onclick="rebirth()"></button></div>
<h2>カスタマイズ</h2>
<details id="cf" class="c cf"></details>
<h2>セーブ・サウンド</h2>
<div class="row"><button onclick="save(1)">セーブ</button><button onclick="load(1)">ロード</button><button onclick="exp()">コード書き出し</button><button onclick="imp()">コード読み込み</button><button onclick="resetData(this)">🗑 データ削除</button><button onclick="bgm=!bgm;A();this.textContent=bgm?'♪ BGM ON':'♪ BGM OFF'">♪ BGM OFF</button><button onclick="mute=!mute;this.textContent=mute?'🔇 SE OFF':'🔊 SE ON'">🔊 SE ON</button></div>
<textarea id="io" placeholder="ここにセーブコードを貼り付けて「コード読み込み」を押す"></textarea>
<p class="sb">15秒ごとにオートセーブされます。ブラウザに保存できない場合はコードを控えてください。</p>
<p class="sb" id="stt"></p>
</div>
<div id="ts"></div>
<script>
const $=i=>document.getElementById(i),K="nerikeshi_save_v1";
const NM='使い古しの消しゴム,#9aa5b5|ふつうの消しゴム,#1d4fd7|プラスチック消しゴム,#16a34a|香り付き消しゴム,#ec6fa5|キャラ消しゴム,#f08a24|高級ケシゴム,#8b3fd1|製図用消しゴム,#2f5d8a|砂消しゴム,#d49a12|ペン用消しゴム,#7a4a2a|ブロック消しゴム,#5f8f3a|パワー消しゴム,#e23b3b|ターボ消しゴム,#ff7a1a|ダイヤ消しゴム,#2ec4d6|ルビー消しゴム,#d81e5b|サファイア消しゴム,#2f6bff|エメラルド消しゴム,#14b86a|黄金の消しゴム,#e6b800|プラチナ消しゴム,#b8c4d4|隕石消しゴム,#a0522d|月の消しゴム,#e8e2b0|太陽の消しゴム,#ff9d00|彗星消しゴム,#7fe3ff|銀河消しゴム,#5b4bd6|ブラックホール消しゴム,#7a2fc9|時の消しゴム,#19b5a5|龍の消しゴム,#0fa36b|不死鳥の消しゴム,#ff5a2a|世界樹の消しゴム,#3fbf4a|創造神の消しゴム,#ffe27a|全知全能の消しゴム,#e0368a';
const PM=.1;
const E=NM.split('|').map((s,i)=>{const[n,c]=s.split(',');return[n,i?Math.round(17**i):1,i?Math.round(PM*100*1e4**(i-1)):0,c]});
const U=[{id:"p",n:"💪 削りパワー",d:"削り量 +30%",b:50*PM,g:1.6},{id:"c",n:"🧺 ねりけしの器",d:"大きさ上限 ×2",b:80*PM,g:2.8},{id:"v",n:"💰 売値アップ",d:"売値 +25%",b:120*PM,g:1.9},{id:"r",n:"🤖 削りロボ",d:"自動で削る",b:300*PM,g:1.8},{id:"d",n:"⏳ 長持ち加工",d:"消しゴムの寿命 +50%",b:150*PM,g:2},{id:"ak",n:"🌀 自動まとめ",d:"カスを自動でねりけしに",b:E[5][2],g:1,x:1},{id:"as",n:"🏪 自動販売",d:"器が満タンで自動売却",b:E[9][2],g:1,x:1},{id:"ar",n:"🔄 自動交換",d:"すり減ったら自動で新品に交換",b:E[10][2],g:1,x:1}];
const fresh=o=>({coin:0,sh:0,m:0,tot:0,er:0,f:1,lv:{p:0,c:0,v:0,r:0,ak:0,as:0,d:0,ar:0},soul:0,rb:0,all:0,pt:0,ts:0,...o});
let S=fresh(),bgm=0,mute=0,rbc=0,ac;
const pw=()=>E[S.er][1]*(1+.3*S.lv.p)*(1+.1*S.soul)*(.3+.7*S.f),life=()=>120*(1+.5*S.lv.d),rc=()=>Math.ceil(E[S.er][2]*.05),cap=()=>30*2**S.lv.c,
price=m=>m*(1+m/100)*(1+.25*S.lv.v)*(1+.25*S.soul),
cost=u=>Math.ceil(u.b*u.g**S.lv[u.id]),gain=()=>Math.floor((S.tot/2e5)**.25),
fmt=n=>{n=Math.floor(n);if(n<1e4)return n;if(n>=1e72)return n.toExponential(2).replace('+','');const u=['','万','億','兆','京','垓','秭','穣','溝','澗','正','載','極','恒河沙','阿僧祇','那由他','不可思議','無量大数'];let i=0;while(n>=1e4){n/=1e4;i++}return n.toFixed(n<100?2:1)+u[i]},
set=(i,t)=>{const e=$(i);if(e.textContent!=t)e.textContent=t};
function A(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(ac&&ac.state=="suspended")ac.resume();return ac}
function tone(f,d=.1,t="sine",v=.15,at=0,bg){const a=A();if(!a||mute)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+at;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(Math.max(2e-3,v*(bg?CFG.bv:CFG.sv)),s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d)}
function noise(d=.07,v=.18){const a=A();if(!a||mute)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();g.gain.value=v*CFG.sv;s.buffer=b;s.connect(g).connect(a.destination);s.start()}
const SE={shave:()=>noise(),knead:()=>{tone(180,.12,"triangle",.2);tone(140,.14,"triangle",.2,.08)},sell:()=>{tone(988,.1,"square",.07);tone(1319,.25,"square",.07,.09)},buy:()=>[523,659,784].forEach((f,i)=>tone(f,.12,"triangle",.15,i*.07)),no:()=>tone(120,.15,"sawtooth",.08),rb:()=>[392,523,659,784,1047].forEach((f,i)=>tone(f,.3,"triangle",.15,i*.12))};
const sc=[262,294,330,392,440,523],pt=[0,2,4,2,3,5,4,1];let bi=0;
setInterval(()=>{if(bgm)tone(sc[pt[bi++%8]],.4,"sine",.05,0,1)},450);
function toast(t){const e=$("ts");e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2400)}
function puff(x,y){const p=document.createElement("i");p.className="p";p.style.left=x+"px";p.style.top=y+"px";document.body.appendChild(p);p.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.random()*80-40}px,${40+Math.random()*30}px)`,opacity:0}],600).onfinish=()=>p.remove()}
const wear=c=>{const o=S.f;S.f=Math.max(0,o-c/life());if(o>0&&S.f<=0){noise(.3,.25);tone(220,.3,"sawtooth",.1);G&&G.spawn(24,0xf4f6f9,5,.12);toast("消しゴムを使い切った！ 新しい消しゴムに交換しよう")}};
function renew(q){if(S.f>=1){q||toast("まだ新品です");return}const c=rc();if(S.coin>=c){S.coin-=c;S.f=1;SE.buy();G&&G.wave(0xffffff);render();return}if(!q&&S.f<=0&&S.er>0){S.er=0;S.f=1;SE.buy();toast("コインが足りないので、使い古しの消しゴムを拾いました");render();return}q||SE.no()}
function shave(e){if(S.f<=0){SE.no();toast("消しゴムがありません。「新品に交換」を押そう");return}const g=pw();S.sh+=g;wear(1);e&&pop('+'+(g<10?g.toFixed(1):fmt(g)),e.clientX,e.clientY-12);SE.shave();G&&(G.kick=1,G.pv+=2.5,G.k2v+=.8,G.fx(3,0xe9eef5));render()}
function knead(q){const t=Math.min(S.sh,cap()-S.m);if(t<=0){q||SE.no();return}S.m+=t;S.sh-=t;q||(SE.knead(),G&&(G.mg(10),setTimeout(()=>{G.k2=1},380)));render()}
function sell(){if(S.m<1)return SE.no();const g=price(S.m);S.coin+=g;S.tot+=g;S.all+=g;S.m=0;SE.sell();const r=$('gl').getBoundingClientRect();pop('+'+fmt(g)+' 🪙',r.left+r.width*.72,r.top+r.height*.4,'#d9a400');G&&(G.coins(18),G.zp=1,G.hop=1);$('coin').animate([{transform:'scale(1.4)'},{transform:'none'}],380);render()}
function buyE(i){if(i<=S.er||S.coin<E[i][2])return SE.no();S.coin-=E[i][2];S.er=i;S.f=1;SE.buy();G&&G.wave(0xffc83d);render();jump()}
function buyU(i){const u=U[i],c=cost(u);if(S.coin<c||(u.x&&S.lv[u.id]>=1))return SE.no();S.coin-=c;S.lv[u.id]++;SE.buy();render()}
function rebirth(){const g=gain();if(g<1)return SE.no();if(!rbc){rbc=1;toast("もう一度押すと転生します（魂 +"+g+"）");setTimeout(()=>rbc=0,3000);return}rbc=0;S=fresh({soul:S.soul+g,rb:S.rb+1,all:S.all,pt:S.pt});SE.rb();G&&(G.spawn(40,0x9bd1ff,7,.1,1),G.wave(0x9bd1ff),G.zp=2.5,G.ob=9);toast("転生しました！ 魂 +"+g);render();save()}
let rsc=0;
function jump(){const c=$('se'),b=$('e'+Math.min(E.length-1,S.er+1));c.scrollTop=b.offsetTop-8}
function off(){const s=Math.min(28800,(Date.now()-(S.ts||Date.now()))/1e3);if(s<60||!S.lv.r||S.f<=0)return;const n=Math.min(.1*S.lv.r*s,S.f*life()),sh=pw()*n;S.f=Math.max(0,S.f-n/life());let g=0;if(S.lv.ak&&S.lv.as){const C=cap();g=sh/C*price(C);S.coin+=g;S.tot+=g;S.all+=g}else S.sh+=sh;toast('おかえりなさい！ 離席中に '+(g?fmt(g)+' コイン':'カス '+fmt(sh))+' 獲得')}
function resetData(b){if(!rsc){rsc=1;b.textContent='⚠ もう一度押すと削除';setTimeout(()=>{rsc=0;b.textContent='🗑 データ削除'},3500);return}rsc=0;b.textContent='🗑 データ削除';try{localStorage.removeItem(K)}catch(e){}S=fresh();$('io').value='';render();jump();toast('セーブデータを削除しました')}
function save(v){try{S.ts=Date.now();localStorage.setItem(K,JSON.stringify(S));v&&toast("セーブしました")}catch(e){v&&toast("ブラウザ保存が使えません。コード書き出しを使ってください")}}
function ld(o){S=fresh(o);S.lv={...fresh().lv,...o.lv}}
function load(v){try{const j=localStorage.getItem(K);if(!j)return v&&toast("セーブデータがありません");ld(JSON.parse(j));off();render();v&&toast("ロードしました")}catch(e){v&&toast("ロードできませんでした")}}
function exp(){$("io").value=btoa(JSON.stringify(S));$("io").select();toast("コードを書き出しました。コピーして保管してください")}
function imp(){try{ld(JSON.parse(atob($("io").value.trim())));render();save();toast("コードから読み込みました")}catch(e){toast("コードが正しくありません")}}
function render(){const cp=cap(),g=gain();
set("coin",fmt(S.coin));set("sh",fmt(S.sh));set("m",fmt(S.m)+" / "+fmt(cp));set("pr",fmt(price(S.m)));
G&&G.sync(cp);
set("en",S.f>0?E[S.er][0]+"（残り "+Math.ceil(S.f*100)+"%・1回でカス "+fmt(pw())+"）":"消しゴムがなくなりました！「新品に交換」を押そう");$("rnb").className=S.f>0?"":"main";$('kb').classList.toggle('pl',S.sh>=1&&S.m<cap()*.999);$('sbt').classList.toggle('pl',S.m>=cap()*.95);set('stt','累計獲得 '+fmt(S.all)+' コイン／プレイ時間 '+Math.floor(S.pt/60)+' 分／転生 '+S.rb+' 回');const bs=$("dub").style;bs.width=S.f*100+"%";bs.background=S.f<.25?"var(--rd)":"var(--ac)";set("rcs",rc()?"💰 "+fmt(rc()):"無料");
E.forEach((e,i)=>{const b=$("e"+i);b.className="it"+(i==S.er?" on":"");b.disabled=i<=S.er||S.coin<e[2];set("e"+i,(i+1)+". "+e[0]+"　削り力 "+fmt(e[1])+"　"+(i<S.er?"購入済":i==S.er?"装備中":"💰 "+fmt(e[2])))});
U.forEach((u,i)=>{const l=S.lv[u.id],mx=u.x&&l>=1;$("u"+i).disabled=mx||S.coin<cost(u);set("u"+i,u.n+(u.x?"":" Lv"+l)+"　"+u.d+"　"+(mx?"購入済":"💰 "+fmt(cost(u))))});
set("ri","魂 "+S.soul+"（売値 +"+25*S.soul+"% ・削り +"+10*S.soul+"%）　転生 "+S.rb+"回");set("rbb","🔥 転生する（魂 +"+g+"）");$("rbb").disabled=g<1}
const CD={bg:1,th:'auto',ac:'',ec:'',nc:'',pp:0,md:0,cm:0,q:2,sv:1,bv:1,pr:1,mo:1};
let CFG={...CD};
try{Object.assign(CFG,JSON.parse(localStorage.getItem('nerikeshi_cfg_v1')||'{}'))}catch(e){}
function cfgSet(k,v){CFG[k]=v;cfgApply();try{localStorage.setItem('nerikeshi_cfg_v1',JSON.stringify(CFG))}catch(e){}}
function cfgApply(){const d=document.documentElement;if(CFG.th=='auto')d.removeAttribute('data-theme');else d.dataset.theme=CFG.th;if(CFG.ac)d.style.setProperty('--ac',CFG.ac);else d.style.removeProperty('--ac');G&&G.cfg()}
const CF=[['bg','背景',1,[[1,'窓際の机'],[2,'黒板の教室'],[3,'図書館の本棚'],[4,'宇宙'],[5,'障子の和室'],[6,'水族館'],[0,'なし']]],['th','テーマ',0,[['auto','自動'],['light','ライト'],['dark','ダーク']]],['pp','ノート',1,[[0,'方眼'],[1,'罫線'],[2,'無地'],[3,'ドット']]],['md','時間帯',1,[[0,'昼'],[1,'夕方'],[2,'夜']]],['cm','カメラ',1,[[0,'標準'],[1,'俯瞰'],[2,'ローアングル']]],['q','画質',1,[[2,'高'],[1,'標準'],[0,'軽量']]]];
function cfgUI(){const f=$('cf'),L=(n,h)=>`<label>${n}${h}</label>`;
f.innerHTML='<summary>🎨 設定を開く</summary>'+CF.map(([k,n,m,o])=>L(n,`<select data-k='${k}' data-n='${m}' id='k-${k}'>${o.map(([v,l])=>`<option value='${v}'>${l}</option>`).join('')}</select>`)).join('')
